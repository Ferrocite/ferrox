
[advisories]
unmaintained = "workspace"
unsound = "all"
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
  { name = "sing-box", reason = "GPL-3.0; a comparator is read at its pin, never linked" },
  { name = "v2ray-rust", reason = "the upstream implementation ferrox-core replaces" },
  { name = "gpl-3.0", reason = "no copyleft dependency may enter the graph" },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unlicense",
  "Unicode-3.0",
  "LGPL-2.1-or-later",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
