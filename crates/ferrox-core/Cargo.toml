[package]
name = "ferrox-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
bench-reference = []

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
blake2 = "0.11"
blake3 = "1"
getrandom = "0.4"
hkdf = "0.13"
chacha20 = "0.9"
chacha20poly1305 = "0.10"
md5 = "0.8"
ring = "0.17"
rustls = { workspace = true, features = ["std", "ring"] }
sha2 = "0.11"
sha1 = "0.11"
sha3 = "0.12"
shake = "0.1"
x25519-dalek = { version = "3", features = ["static_secrets"] }
ml-kem = { version = "0.3.3", features = ["getrandom"] }
base64 = "0.23"
rand = "0.10"
ctr = "0.9"
zeroize = "1"
des = "0.9"

[dev-dependencies]
poly1305 = "0.8"
