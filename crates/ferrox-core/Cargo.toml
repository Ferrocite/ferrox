[package]
name = "ferrox-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
bench-reference = []

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
blake3 = "1"
hkdf = "0.12"
chacha20 = "0.9"
md5 = "0.7"
ring = "0.17"
rustls = { workspace = true, features = ["std", "ring"] }
sha2 = "0.10"
sha1 = "0.10"
x25519-dalek = "2"
ml-kem = { version = "0.3.2", features = ["getrandom"] }
base64 = "0.22"
rand = "0.9"
ctr = "0.9"
zeroize = "1"

[dev-dependencies]
chacha20poly1305 = "0.10"

poly1305 = "0.8"
