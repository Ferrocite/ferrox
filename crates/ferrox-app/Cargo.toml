[package]
name = "ferrox-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "ZeroNet-compatible application built on the released ferrox-core (MIT)"

[lints]
workspace = true

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
ferrox-core = { workspace = true }
getrandom = "0.2"
quiche = "0.30"
libc = "0.2"
md5 = "0.7"
base64 = "0.22"
rustls-native-certs = "0.8"
sha1 = "0.10"
sha3 = { version = "0.10", features = ["asm"] }
sha2 = { version = "0.10" }
x25519-dalek = "2"

[dev-dependencies]
chacha20poly1305 = "0.10"
rcgen = "0.13"

[target.'cfg(not(target_os = "windows"))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_System_IO",
] }
