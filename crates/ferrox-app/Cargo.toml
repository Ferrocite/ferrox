[package]
name = "ferrox-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "ZeroNet-compatible application built on the released ferrox-core (MIT)"

[lints]
workspace = true

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
aho-corasick = "1"
ferrox-core = { workspace = true }
getrandom = "0.4"
hkdf = "0.13"
quiche = "0.30"
libc = "0.2"
md5 = "0.8"
mlua = { version = "0.11", features = ["lua51", "vendored", "send"] }
regex = "1"
ring = "0.17"
base64 = "0.23"
ctr = "0.9"
flate2 = "1"
rustls-native-certs = "0.8"
sha1 = "0.11"
sha3 = { version = "0.12" }
# `sha3` 0.12 split SHAKE out into its own crate, which `sha3` already pulls in.
shake = "0.1"
sha2 = { version = "0.11" }
x25519-dalek = "3"
socket2 = "0.6"
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-tcp-cubic"] }

[dev-dependencies]
chacha20poly1305 = "0.10"
rcgen = "0.14"

[target.'cfg(not(target_os = "windows"))'.dependencies]
sha2 = { version = "0.11" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_System_IO",
] }
