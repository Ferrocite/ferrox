name: release

# Ships the lanes. On a version tag (or on demand) this builds `ferrox-app`
# for every platform a user can run it on and attaches one package per platform
# to the GitHub Release: the binary, `ferrox-cli.sh` beside it, and the two
# pages that make trying a lane three commands — `login`, `up --foxy --vpn`
# (or `up --veepn --vpn` with no account), `down` — with no toolchain, no
# repository and no config by hand.
#
# Nothing here dials a connection: the job compiles, smoke-runs the binary's
# own version line, and packages. Whether a lane carries bytes is gated by
# foxy-relay.yml, veepn-relay.yml and the parity matrix, never by a release
# build. Every leg must go green for the release to be written; a platform
# that cannot build holds the release rather than shipping a page that
# promises it.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: an existing tag (vX.Y.Z) to rebuild onto; leave empty to ship the version Cargo.toml declares
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# The release job writes the tag and the assets; the build jobs only read.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: the version to ship
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: name the release
        id: v
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          WANT: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT" = push ]; then
            echo "version=$REF_NAME" >> "$GITHUB_OUTPUT"
          elif [ -n "$WANT" ]; then
            case "$WANT" in
              v[0-9]*.[0-9]*.[0-9]*) ;;
              *) echo "::error::the tag input must name an existing vX.Y.Z tag, got: $WANT"; exit 1 ;;
            esac
            echo "version=$WANT" >> "$GITHUB_OUTPUT"
          else
            # Nothing typed: the version this workspace declares is the version
            # to ship, so pressing the button once is the whole interaction.
            DECLARED="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
            [ -n "$DECLARED" ] || { echo "::error::cannot read the workspace version from Cargo.toml"; exit 1; }
            echo "version=v$DECLARED" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-26.04-arm
            pkg: aarch64-linux-gnu
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-26.04
            pkg: x86_64-linux-gnu
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-${{ matrix.target }}-${{ matrix.os }}
      - name: install the QUIC build tool
        if: runner.os == 'Windows'
        shell: bash
        run: choco install nasm -y --no-progress || { choco list --local-only 2>/dev/null | grep -iq nasm; }
      - name: build the binary
        shell: bash
        env:
          # The same crypto cfgs ci.yml arms and .cargo/config.toml documents:
          # aarch64 consults them, x86_64 consults neither, so every package
          # holds the runtime-dispatching build the local gates measured.
          RUSTFLAGS: --cfg aes_armv8 --cfg polyval_armv8
        run: cargo build --locked --release -p ferrox-app --target "${{ matrix.target }}"
      - name: prove the binary runs
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/ferrox-app"
          if [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          "$BIN" version
      - name: package the lane kit
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          NAME: ${{ matrix.pkg || matrix.target }}
        run: |
          BIN="target/${{ matrix.target }}/release/ferrox-app"
          if [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          PKG="ferrox-${VERSION#v}-${NAME}"
          rm -rf "$PKG" && mkdir -p "$PKG"
          cp "$BIN" dist/ferrox-cli.sh dist/README.md dist/USAGE.md "$PKG/"
          chmod +x "$PKG/$(basename "$BIN")" "$PKG/ferrox-cli.sh" 2>/dev/null || true
          case "$(uname -s)" in
            Darwin|Linux)
              COPYFILE_DISABLE=1 tar --no-xattrs -czf "$PKG.tar.gz" "$PKG" ;;
            *)
              7z a -tzip "$PKG.zip" "$PKG" >/dev/null ;;
          esac
          rm -rf "$PKG"
          ls -l ferrox-*
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.target }}
          path: ferrox-*
          if-no-files-found: error

  release:
    name: publish ${{ needs.plan.outputs.version }}
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: packages
          merge-multiple: true
      - name: the handout
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          BODY: |-
            ## Ferrox VERSION_PLACEHOLDER — pick your carrier: h1, h2 or h3

            Unpack your platform's package and run the CLI beside the binary — no cargo, no repository:

            ```bash
            tar xzf ferrox-VERSION_PLACEHOLDER-aarch64-apple-darwin.tar.gz
            cd ferrox-VERSION_PLACEHOLDER-aarch64-apple-darwin
            ./ferrox-cli.sh up --foxy --vpn        # asks for email, password and carrier, then connects
            ./ferrox-cli.sh up --foxy --carrier h3 --vpn   # names the carrier and skips the question
            ./ferrox-cli.sh status                 # uptime, the carrier it chose, quota left, exit IP and country
            ./ferrox-cli.sh down
            ```

            ### The lanes this build carries

            | lane | what you supply | start it |
            | --- | --- | --- |
            | **Foxy** | a Firefox account, email + password, a carrier; **no server** | `./ferrox-cli.sh up --foxy --vpn` |
            | **VeePN** | **nothing**: anonymous, no account, no server | `./ferrox-cli.sh up --veepn --vpn` |
            | **VLESS** | a `vless://` link: tcp, ws, grpc, httpupgrade or xhttp; TLS or REALITY | `./ferrox-cli.sh up --vless 'vless://...'` |
            | **VMess** | `HOST:PORT` and the user id | `./ferrox-cli.sh up --vmess host:443 --uuid ID` |
            | **Trojan** | `HOST:PORT` and the password | `./ferrox-cli.sh up --trojan host:443 --password PW` |
            | **Shadowsocks** | `HOST:PORT`, method and password | `./ferrox-cli.sh up --ss host:8388 --method aes-256-gcm --password PW` |
            | **SOCKS outbound** | a JSON config naming `socks` as the protocol | `--config`: the client role dials out SOCKS5, and `version: "4"` speaks SOCKS4 and SOCKS4a |
            | **Any served config** | a JSON config | `./ferrox-cli.sh up --config mine.json` |

            ### Choosing the carrier on the Foxy lane (new in this release)

            A **carrier** is how the lane sends its flows to the edge. `--carrier`
            names one, and on a terminal `up --foxy` asks once — an empty answer
            or a pipe takes `auto`:

            | carrier | what it is | when to pick it |
            | --- | --- | --- |
            | `auto` | the ladder h2 → h1 → h3, the fastest that answers | the default, and what a non-terminal gets |
            | `h2` | HTTP/2 CONNECT; one session is reused across flows | almost always — it outran `h3` in every CI relay run, on every runner |
            | `h1` | HTTP/1.1 CONNECT; one TLS connection per flow | a network or middlebox that mishandles HTTP/2 |
            | `h3` | HTTP/3 over QUIC | **the only carrier that carries UDP** — the datagram lane rides it |

            A named `h3` is a preference, not a pin: it leads the ladder, and a
            path that drops QUIC — silence, not a refusal — is abandoned five
            seconds into the handshake, so the TCP rungs follow and the lane
            carries anyway. A signed-in account renews the edge pass on its own
            clock (a lane left running overnight keeps working), `--country DE`
            moves the exit, `--city` pins a city tier, two-factor sign-in passes
            `--code 123456` once, and `--upstream socks5://127.0.0.1:1080` dials
            the edge through a hop this network allows. A `foxy://` share link —
            the same settings, carrier included — is read from a config with
            `--config`.

            `status` now reads the lane back: how long it has been up, the
            carrier it was given, the allowance the plane last named (bytes left
            of the plan and when they reset), and the exit IP and country.

            ### Leaner where it counts

            Since the last release the Foxy lane lost a handshake per
            flow — an ended flow lends its HTTP/2 session to the next — a
            buffer per datagram and a `recvfrom` per packet, and the lock its
            shared lane's idle poll held while it slept. The same grind reached
            the other lanes: xhttp and Shadowsocks allocate twice less per frame
            and per datagram and xhttp stages its dial head once per thread, the
            WebSocket keys are stack arrays and a VLESS request header is parsed
            without a byte of its own, the buffers a flow fills are no longer
            zeroed first (VLESS, SOCKS, KCP), an HTTP/2 header block is opened
            once at its own length instead of grown four times, a datagram
            leaves in the frame its client framed, and a relay socket's two
            directions no longer share a lock. On x86_64 a ChaCha20 record's
            remainder is finished inside the vector pass — eight blocks per pass
            where the scalar ladder managed six, sixteen where the machine has
            avx512f — so a chacha stream pays less work per kept block; the
            `aarch64` pass keeps the shape it had. The trade is named on the
            page: the pass computes blocks the buffer does not hold, so
            discarded blocks rise, and the last one or two blocks are still the
            ladder's.

            ### Also new under the hood

            **Routing rules** ride `--config` now: AND selectors over domain,
            ip, port, source and inbound tag, matched against `geosite.dat`
            and `geoip.dat` decoded at startup; a lane the transport cannot
            carry is refused by name, and a flow can be sent to the
            **blackhole** sink, whose answers are octet-for-octet the
            reference's. **SOCKS serves and dials** in both roles — SOCKS5,
            SOCKS4 and SOCKS4a — so an upstream hop can be a SOCKS front.
            **QUIC** carries a whole datagram per packet with a receive window
            that grows, and **dokodemo-door** has its UDP door.

            **VeePN** is the lane with nothing to type in. The plane launches this device
            anonymously, names the fastest region — `--region us-va` pins one — and lists
            the upstreams that answer for the pair it printed. Its live byte path is gated
            in CI by `veepn-relay.yml`: exactly 1,000,000 B through the named SOCKS, HTTP
            and mixed fronts on Ubuntu and macOS, and through `us-va`, `us-or`, `gb-lnd`,
            `fr-prs`, `sg` and `ru-spb`.

            **VLESS, VMess, Trojan and Shadowsocks** dial the server their link or
            `HOST:PORT` names. The VLESS converter writes tcp, ws, grpc, httpupgrade and
            xhttp with `security=none|tls|reality`; anything else the binary serves —
            kcp, quic, hysteria, httpheader, masque, xdrive — rides `--config` verbatim.

            All lanes serve the same loopback fronts: SOCKS5 `127.0.0.1:10808`, HTTP+HTTPS
            `127.0.0.1:8080`, mixed `127.0.0.1:10809`. `--vpn` points the macOS system proxy
            at them only after a real flow answers; `down` stops the lane and clears the
            proxy.

            | package | platform |
            | --- | --- |
            | `ferrox-VERSION_PLACEHOLDER-aarch64-apple-darwin.tar.gz` | macOS on Apple Silicon |
            | `ferrox-VERSION_PLACEHOLDER-x86_64-apple-darwin.tar.gz` | macOS on Intel |
            | `ferrox-VERSION_PLACEHOLDER-aarch64-linux-gnu.tar.gz` | Linux on aarch64, built on Ubuntu 26.04 |
            | `ferrox-VERSION_PLACEHOLDER-x86_64-linux-gnu.tar.gz` | Linux on x86_64, built on Ubuntu 26.04 |
            | `ferrox-VERSION_PLACEHOLDER-x86_64-pc-windows-msvc.zip` | Windows x86_64 (CLI runs in Git Bash) |

            `README.md` in each package is the quickstart, `USAGE.md` the manual.
        run: |
          printf '%s\n\nBuilt by `release.yml` from commit `%s`.\n' "$BODY" "${GITHUB_SHA::8}" \
            | sed "s/VERSION_PLACEHOLDER/${VERSION#v}/g" >RELEASE-BODY.md
          head -5 RELEASE-BODY.md
      - name: publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # This job holds no checkout, so the repo has to be named for gh.
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          shopt -s nullglob
          assets=(packages/*)
          [ "${#assets[@]}" -gt 0 ] || { echo "::error::no packages came back" ; exit 1; }
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "${assets[@]}" --clobber
            gh release edit "$VERSION" --notes-file RELEASE-BODY.md
          elif [ "$EVENT" = workflow_dispatch ]; then
            # A dispatched release of a version with no tag yet: cut the tag at
            # the commit that built these packages, so the assets and the tag
            # can never disagree about what this version is.
            gh release create "$VERSION" --target "$GITHUB_SHA" \
              --title "Ferrox $VERSION: pick your carrier — h1, h2 or h3" --notes-file RELEASE-BODY.md "${assets[@]}"
          else
            gh release create "$VERSION" --title "Ferrox $VERSION: pick your carrier — h1, h2 or h3" \
              --notes-file RELEASE-BODY.md "${assets[@]}"
          fi
          gh release view "$VERSION" --json tagName,assets \
            --jq '.tagName + ": " + ([.assets[].name] | join(", "))'
      - name: the links, on the run page
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          {
            echo "### Ferrox $VERSION is shipping"
            echo
            for f in packages/*; do
              n="$(basename "$f")"
              echo "- [$n](https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/$n)"
            done
            echo
            echo "Three commands from any of them: unpack, \`./ferrox-cli.sh up --foxy --vpn\` (or \`--veepn\` for no account), done — the CLI asks for the account the first time."
          } >> "$GITHUB_STEP_SUMMARY"
