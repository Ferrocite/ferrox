name: warp-register probe
on:
  workflow_dispatch:

concurrency:
  group: warp-probe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    name: probe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Aether registers anonymously from this runner
        run: |
          set -x
          mkdir -p upstream/aether target/release
          curl -sSLo upstream/aether/../aether.tgz https://github.com/CluvexStudio/Aether/archive/9ebdcc945af12ea532b32119884f846bdb9c4bfc.tar.gz
          tar -xzf upstream/aether/../aether.tgz --strip-components=1 -C upstream/aether
          (cd upstream/aether/aether \
            && env -u CARGO_ENCODED_RUSTFLAGS cargo build --locked --release --bin aether 2>&1 | tail -2)
          mv target/release/aether /tmp/aether
          /tmp/aether --register masque --masque-config "target/probe/identities.toml" 2>&1 | tail -40
