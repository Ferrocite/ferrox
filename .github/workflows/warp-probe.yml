name: warp-register probe
on:
  workflow_dispatch:

concurrency:
  group: warp-probe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    name: probe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: The register runs first, then the reference, so an order artifact stands apart from the bytes
        run: |
          set -x
          mkdir -p upstream/aether target/release
          cargo build --locked --release -p ferrox-app 2>&1 | tail -1
          target/release/ferrox-app warp-register 2>&1 | tail -6 || true
          curl -sSLo upstream/aether/../aether.tgz https://github.com/CluvexStudio/Aether/archive/9ebdcc945af12ea532b32119884f846bdb9c4bfc.tar.gz
          tar -xzf upstream/aether/../aether.tgz --strip-components=1 -C upstream/aether
          (cd upstream/aether/aether \
            && env -u CARGO_ENCODED_RUSTFLAGS cargo build --locked --release --bin aether 2>&1 | tail -2)
          mv upstream/aether/aether/target/release/aether /tmp/aether
          /tmp/aether --register masque --masque-config "target/probe/identities.toml" 2>&1 | tail -6
          echo "the reference's own token, for length beside ours:"
          grep -o 'token = "[^"]*"' target/probe/identities.toml | head -1 | wc -c || true
      - name: The register's request bytes, ours beside the reference's, from a local echo
        run: |
          set -x
          python3 -m pip install --quiet h2
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -keyout /tmp/ca.key -out /tmp/ca.pem -subj "/CN=echo ca" -addext "basicConstraints=critical,CA:TRUE" >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes -keyout /tmp/key.pem -out /tmp/leaf.csr -subj "/CN=echo.example" >/dev/null 2>&1
          printf "subjectAltName=IP:127.0.0.1,DNS:echo.example\nextendedKeyUsage=serverAuth\n" > /tmp/ext.cnf
          openssl x509 -req -in /tmp/leaf.csr -CA /tmp/ca.pem -CAkey /tmp/ca.key -CAcreateserial -days 2 -out /tmp/cert.pem -extfile /tmp/ext.cnf >/dev/null 2>&1
          sudo cp /tmp/ca.pem /usr/local/share/ca-certificates/echo-ca.crt
          sudo update-ca-certificates >/dev/null 2>&1
          echo "the leaf is trusted by the system store"
          cat > /tmp/capture.py <<'EOF'
          import ssl, socket, sys
          from h2.connection import H2Connection
          from h2.config import H2Configuration
          from h2.events import RequestReceived, DataReceived, StreamEnded, RemoteSettingsChanged, WindowUpdated, PingReceived, PriorityUpdated

          class Cap:
              def __init__(self, conn, sock, tag):
                  self.conn, self.sock, self.tag = conn, sock, tag
                  self.bodies = {}
                  self.heads = {}
              def handle(self, event):
                  if isinstance(event, RemoteSettingsChanged):
                      for cid, cv in event.changed_settings.items():
                          print(f"[{self.tag}] SETTINGS {cid.name}={cv.new_value}", flush=True)
                  elif isinstance(event, WindowUpdated):
                      print(f"[{self.tag}] WINDOW stream={event.stream_id} delta={event.delta}", flush=True)
                  elif isinstance(event, PingReceived):
                      print(f"[{self.tag}] PING {event.ping_data.hex()}", flush=True)
                  elif isinstance(event, PriorityUpdated):
                      print(f"[{self.tag}] PRIORITY stream={event.stream_id} dep={event.depends_on} weight={event.weight} excl={event.exclusive}", flush=True)
                  if isinstance(event, RequestReceived):
                      self.heads[event.stream_id] = event.headers
                      self.bodies[event.stream_id] = b""
                  elif isinstance(event, DataReceived):
                      self.bodies[event.stream_id] += event.data
                  elif isinstance(event, StreamEnded):
                      sid = event.stream_id
                      print("==== REQUEST ====", flush=True)
                      for name, value in self.heads[sid]:
                          print(f"{name}: {value}", flush=True)
                      body = self.bodies[sid]
                      print(f"body: {body.decode('utf-8', 'replace')}", flush=True)
                      self.conn.send_headers(sid, [(":status", "404"), ("content-type", "application/json")])
                      self.conn.send_data(sid, b'{"result":null,"success":false,"errors":[{"code":1012,"message":"Not authorized"}],"messages":[]}', True)
                  self.flush()
              def flush(self):
                  data = self.conn.data_to_send()
                  if data:
                      self.sock.sendall(data)

          ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          ctx.load_cert_chain("/tmp/cert.pem", "/tmp/key.pem")
          ctx.set_alpn_protocols(["h2"])
          server = socket.socket()
          server.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          server.bind(("127.0.0.1", 8443))
          server.listen(4)
          server.settimeout(300)
          while True:
              try:
                  sock, _ = server.accept()
              except Exception as e:
                  print(f"accept failed: {e}", flush=True)
                  continue
              try:
                  sock.settimeout(1)
                  hello = sock.recv(4096, socket.MSG_PEEK)
                  sock.settimeout(300)
                  print(f"HELLO {hello[:900].hex()}", flush=True)
              except Exception as e:
                  print(f"hello peek failed: {e}", flush=True)
              try:
                  tls = ctx.wrap_socket(sock, server_side=True)
              except Exception as e:
                  print(f"TLS accept failed: {e}", flush=True)
                  try:
                      sock.close()
                  except Exception:
                      pass
                  continue
              conn = H2Connection(H2Configuration(client_side=False))
              conn.initiate_connection()
              cap = Cap(conn, tls, "conn")
              cap.flush()
              try:
                  while True:
                      data = tls.recv(65536)
                      if not data:
                          print("TLS EOF", flush=True)
                          break
                      print(f"frames: {data[:48].hex()}", flush=True)
                      for event in conn.receive_data(data):
                          print(f"[conn] EVENT {type(event).__name__}", flush=True)
                          cap.handle(event)
              except Exception as e:
                  print(f"stream ended: {e}", flush=True)
              tls.close()
          EOF
          python3 /tmp/capture.py > /tmp/capture.log 2>&1 &
          disown
          sleep 2
          python3 -c "import socket; s=socket.create_connection(('127.0.0.1', 8443), 3); s.close(); print('echo alive')"
          cargo build --locked --release -p ferrox-app
          bin=target/release/ferrox-app
          echo "---- ours over the local echo ----"
          "$bin" warp-register --api https://127.0.0.1:8443/v0a4471 2>&1 | tail -3 || true
          sleep 1
          echo "---- the reference over the local echo ----"
          /tmp/aether --register masque --masque-config "target/probe/identities2.toml" --api-host echo.example --api-sni echo.example --api-address 127.0.0.1:8443 2>&1 | tail -6 || true
          sleep 1
          kill %1 2>/dev/null || true
          echo "captured requests:"
          head -120 /tmp/capture.log || true
          grep -c "==== REQUEST ====" /tmp/capture.log || true
