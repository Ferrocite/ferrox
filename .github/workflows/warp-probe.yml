name: warp-register probe
on:
  workflow_dispatch:

concurrency:
  group: warp-probe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    name: probe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Aether registers anonymously from this runner
        run: |
          set -x
          mkdir -p target/probe
          curl -sSLo target/probe/aether.tgz https://github.com/CluvexStudio/Aether/archive/9ebdcc945af12ea532b32119884f846bdb9c4bfc.tar.gz
          tar -xzf target/probe/aether.tgz -C target/probe
          (cd target/probe/Aether-9ebdcc945af12ea532b32119884f846bdb9c4bfc/aether \
            && cargo build --locked --release --bin aether 2>&1 | tail -2)
          cp target/probe/Aether-9ebdcc945af12ea532b32119884f846bdb9c4bfc/aether/target/release/aether target/probe/aether
          target/probe/aether --register masque --masque-config "target/probe/identities.toml" 2>&1 | tail -40
