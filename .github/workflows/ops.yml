name: ops

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/ferrox-core/**'
      - 'crates/ferrox-app/**'
      - 'scripts/count-ops.sh'
      - 'scripts/expected-ops.txt'
      - 'scripts/method-ops.txt'
      - 'scripts/method-counts.txt'
      - 'scripts/ci-scope.py'
      - 'docs/function/**'
      - '.github/workflows/ops.yml'
  workflow_dispatch:

# Supersede an older run of the same branch on each new push; a manual dispatch keeps its run.
concurrency:
  group: ops-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    name: plan what this change owes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      wide: ${{ steps.scope.outputs.wide }}
      rust: ${{ steps.scope.outputs.rust }}
      ops: ${{ steps.scope.outputs.ops }}
      methods: ${{ steps.scope.outputs.methods }}
      rows: ${{ steps.scope.outputs.ops_rows }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: plan the scope
        id: scope
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            python3 scripts/ci-scope.py scope --base "$BASE"
          else
            python3 scripts/ci-scope.py scope --wide
          fi

  counts:
    name: exact operation counts (${{ needs.plan.outputs.rows }} row(s))
    needs: plan
    if: needs.plan.outputs.ops == 'true'
    runs-on: ubuntu-24.04
    container:
      image: buildpack-deps:noble-scm@sha256:7cd30264921d935e52e399fdbae125f6a5a763e89a5a031362c8f449fccddbbc
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    steps:
      - name: provision the counting userspace from a fixed archive
        run: |
          apt-get update -qq --snapshot 20261027T000000Z
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            --snapshot 20261027T000000Z build-essential ca-certificates cmake curl git \
            libclang-dev pkg-config python3 strace zstd valgrind=1:3.22.0-0ubuntu3 libc6-dbg=2.39-0ubuntu8.9
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: trust the mounted checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ops-line-tables-ubuntu24-20261027
      - name: plan the scope, so the rows are read from the same plan
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            python3 scripts/ci-scope.py scope --base "$BASE" > /dev/null
          else
            python3 scripts/ci-scope.py scope --wide > /dev/null
          fi
      - name: check exact counts
        if: needs.plan.outputs.rust == 'true'
        env:
          RUSTFLAGS: -C debuginfo=line-tables-only
        run: ./scripts/count-ops.sh check quic::tests::pem_wraps_at_sixty_four_columns scripts/expected-ops.txt
      - name: report the per-method counts in scope, never red
        env:
          RUSTFLAGS: -C debuginfo=line-tables-only
        run: |
          mkdir -p target
          {
            echo '# per-method retired instructions, informational'
            echo
            echo "Scope: ${{ needs.plan.outputs.methods || 'the whole tree' }} -- ${{ needs.plan.outputs.reason }}"
          } > target/method-ops.md
          python3 scripts/ci-scope.py rows > .ferrox/scope-rows.txt
          # One call, so one build of the two test binaries serves every row: the
          # loop this replaces resolved both of them once per row, 31 times.
          ./scripts/count-ops.sh report-file .ferrox/scope-rows.txt \
            >> target/method-ops.md 2>&1 || echo 'measurement broke; see the log above' \
            >> target/method-ops.md
          cat target/method-ops.md
      - uses: actions/upload-artifact@v4
        with:
          name: method-ops
          path: target/method-ops.md
          if-no-files-found: error
