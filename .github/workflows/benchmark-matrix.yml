name: benchmark-matrix


on:
  pull_request:
    paths:
      - "crates/**/*.rs"
      - "crates/**/*.toml"
      - "scripts/run-benchmark-matrix.sh"
      - "scripts/render-benchmark-charts.py"
      - ".github/workflows/benchmark-matrix.yml"
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: "Matrix tier to run"
        required: false
        default: "standard"
        type: choice
        options:
          - smoke
          - standard
          - full
      repeats:
        description: "Medians per cell per engine (blank = the tier default)"
        required: false
        default: ""
        type: string
      engines:
        description: "Comma-separated engine list (blank = the tier default)"
        required: false
        default: ""
        type: string
      only:
        description: "Comma-separated scenario substring filter (blank = every scenario in the tier)"
        required: false
        default: ""
        type: string

concurrency:
  group: matrix-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings --cfg aes_armv8 --cfg polyval_armv8

jobs:
  setup:
    name: plan the tier and its cells
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      cells: ${{ steps.plan.outputs.cells }}
      oses: ${{ steps.plan.outputs.oses }}
      flags: ${{ steps.plan.outputs.flags }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          WANT_TIER: ${{ inputs.tier }}
          WANT_ONLY: ${{ inputs.only }}
          WANT_REPEATS: ${{ inputs.repeats }}
          WANT_ENGINES: ${{ inputs.engines }}
        run: |
          if [[ "$EVENT" == "pull_request" ]]; then
            tier="smoke"
            oses='["ubuntu-latest"]'
          elif [[ "$EVENT" == "workflow_dispatch" ]]; then
            tier="${WANT_TIER:-standard}"
            oses='["ubuntu-latest", "ubuntu-24.04-arm", "macos-15", "windows-latest"]'
          else
            tier="standard"
            oses='["ubuntu-latest", "ubuntu-24.04-arm", "macos-15", "windows-latest"]'
          fi
          case "$tier" in smoke | standard | full) ;; *) echo "::error::unknown tier $tier" >&2; exit 2 ;; esac
          source scripts/lib-matrix.sh
          ids="$(scenarios "$tier" | awk '{print $1}')"
          if [[ -n "$WANT_ONLY" ]]; then
            kept=""
            for id in $ids; do
              keep=1
              IFS=',' read -ra pats <<< "$WANT_ONLY"
              for pat in "${pats[@]}"; do [[ "$id" == *"$pat"* ]] || keep=0; done
              ((keep)) && kept="$kept $id"
            done
            ids="$kept"
          fi
          cells="$(for id in $ids; do printf '"%s",' "$id"; done)"
          cells="[${cells%,}]"
          [[ "$cells" != "[]" ]] || { echo "::error::no scenario survived the filter" >&2; exit 1; }
          flags=""
          [[ -n "$WANT_REPEATS" ]] && flags="$flags --repeats $WANT_REPEATS"
          [[ -n "$WANT_ENGINES" ]] && flags="$flags --engines $WANT_ENGINES"
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "cells=$cells" >> "$GITHUB_OUTPUT"
          echo "oses=$oses" >> "$GITHUB_OUTPUT"
          echo "flags=$flags" >> "$GITHUB_OUTPUT"
          echo "tier $tier cells: $cells"

  fetch:
    name: fetch the four comparator trees
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: fetch at the pins
        shell: bash
        run: ./scripts/fetch-upstream.sh --only xray-core,sing-box,zeronet,xray-rust
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-trees
          path: upstream/
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error

  build:
    name: build the engines (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [setup, fetch]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.setup.outputs.oses) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: upstream/pins.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: benchmark-matrix
      - name: install the QUIC build tool
        if: runner.os == 'Windows'
        run: choco install nasm -y --no-progress || echo "nasm already installed"
      - uses: actions/download-artifact@v4
        with:
          name: upstream-trees
          path: upstream
      - uses: actions/cache@v4
        with:
          path: target/parity-engines
          key: matrix-engines-${{ matrix.os }}-${{ hashFiles('upstream/pins.toml') }}
      - name: build every engine without moving traffic
        shell: bash
        run: >
          ./scripts/run-benchmark-matrix.sh
          --tier "${{ needs.setup.outputs.tier }}"
          --out target/benchmark-matrix
          --probe-only
          ${{ needs.setup.outputs.flags }}
      - uses: actions/upload-artifact@v4
        with:
          name: matrix-ferrox-${{ matrix.os }}
          path: |
            target/release/ferrox-bench*
            target/release/ferrox-app*
          retention-days: 1
          if-no-files-found: error

  cells:
    name: measure ${{ matrix.cell }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [setup, build]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.setup.outputs.oses) }}
        cell: ${{ fromJSON(needs.setup.outputs.cells) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # No pip cache here: this job installs nothing, so setup-python's post
      # step has no cache to save and fails on the empty folder.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: target/parity-engines
          key: matrix-engines-${{ matrix.os }}-${{ hashFiles('upstream/pins.toml') }}
      - uses: actions/download-artifact@v4
        with:
          name: matrix-ferrox-${{ matrix.os }}
          path: target/release
      - uses: actions/download-artifact@v4
        with:
          name: upstream-trees
          path: upstream
      - name: run one cell with handed-over binaries
        shell: bash
        run: >
          ./scripts/run-benchmark-matrix.sh
          --tier "${{ needs.setup.outputs.tier }}"
          --out target/benchmark-matrix
          --only "${{ matrix.cell }}"
          --no-build
          ${{ needs.setup.outputs.flags }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matrix-cell-${{ matrix.os }}-${{ matrix.cell }}
          path: target/benchmark-matrix/
          retention-days: 1
          if-no-files-found: error

  collect:
    name: render the bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [setup, cells]
    if: ${{ !cancelled() }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.setup.outputs.oses) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-benchmark.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: matrix-cell-${{ matrix.os }}-*
          path: cell-bundles/
      - name: install the chart dependency
        shell: bash
        run: pip install -r scripts/requirements-benchmark.txt
      - name: merge the cells and render once
        shell: bash
        run: |
          rm -rf target/benchmark-matrix
          mkdir -p target/benchmark-matrix/cells
          first=""
          for bundle in cell-bundles/matrix-cell-${{ matrix.os }}-*/; do
            [[ -z "$first" ]] && first="$bundle"
            cp -r "$bundle"/cells/* target/benchmark-matrix/cells/
            cat "$bundle/commands.sh" >> target/benchmark-matrix/commands.sh
          done
          [[ -n "$first" ]] || { echo "::error::no cell bundle for ${{ matrix.os }}" >&2; exit 1; }
          cp "$first/manifest.txt" target/benchmark-matrix/manifest.txt
          python3 scripts/render-benchmark-charts.py \
            --input target/benchmark-matrix \
            --charts target/benchmark-matrix/charts \
            --results target/benchmark-matrix/matrix-results.json
          python3 scripts/validate-benchmark-matrix.py \
            --cells target/benchmark-matrix/cells \
            --results target/benchmark-matrix/matrix-results.json \
            --charts target/benchmark-matrix/charts
      - name: refuse a bundle that measured nothing
        shell: bash
        run: |
          cells="$(find target/benchmark-matrix/cells -name cell.json | wc -l)"
          echo "cells with a report: $cells"
          if [[ "$cells" == "0" ]]; then
            echo "::error::no matrix cell produced a report on ${{ matrix.os }}; \
              the run above exited 0 without measuring anything"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-matrix-${{ needs.setup.outputs.tier }}-${{ matrix.os }}
          path: target/benchmark-matrix/
          retention-days: 30
          if-no-files-found: error

  refresh:
    name: publish the dated bundles
    needs: collect
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: benchmark-refresh
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-benchmark.txt
      - name: install the chart dependency
        run: pip install -r scripts/requirements-benchmark.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: benchmark-matrix-standard-*
          path: matrix-bundles/
      - name: stamp the bundle date once
        run: echo "STAMP=$(date -u +%F)" >> "$GITHUB_ENV"
      - name: lay out per-runner bundles
        run: |
          for bundle in matrix-bundles/benchmark-matrix-standard-*/; do
            slug="$(grep -m1 '^runner: ' "$bundle/manifest.txt" | cut -d' ' -f2)"
            if [[ -z "$slug" ]]; then
              echo "::error::$bundle has no runner: line in manifest.txt"
              exit 1
            fi
            dest="matrix-published/$STAMP/$slug"
            charts="$dest/charts"
            mkdir -p "$dest" "$charts"
            cp "$bundle/matrix-results.json" "$bundle/manifest.txt" "$dest/"
            cp -r "$bundle/cells" "$dest/cells"
            cp "$bundle"/charts/*.png "$charts/"
            python3 scripts/render-benchmark-charts.py \
              --input "$bundle" \
              --charts "$charts" \
              --results "$dest/matrix-results.json" \
              --runner "$slug"
            python3 scripts/validate-benchmark-matrix.py \
              --cells "$dest/cells" \
              --results "$dest/matrix-results.json" \
              --charts "$charts"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-matrix-published-${{ env.STAMP }}
          path: matrix-published/
          retention-days: 90
          if-no-files-found: error
