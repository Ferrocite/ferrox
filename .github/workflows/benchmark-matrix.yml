name: benchmark-matrix


on:
  pull_request:
    paths:
      - "crates/**/*.rs"
      - "crates/**/*.toml"
      - "scripts/run-benchmark-matrix.sh"
      - "scripts/lib-matrix.sh"
      - "scripts/lib-engines.sh"
      - "scripts/xray-to-singbox.py"
      - "scripts/xray-to-leaf.py"
      - "scripts/benchstats.py"
      - "scripts/benchmark-delta.py"
      - "scripts/render-benchmark-charts.py"
      - "scripts/validate-benchmark-matrix.py"
      - "scripts/check-matrix-legs.py"
      - "scripts/requirements-benchmark.txt"
      - "docs/function/**/*.md"
      - "docs/benchmarks/matrix.md"
      - ".github/workflows/benchmark-matrix.yml"
      - ".github/workflows/benchmark-matrix-os.yml"
  schedule:
    - cron: "41 3 * * *"
    - cron: "17 4 * * 0"
  workflow_dispatch:
    inputs:
      tier:
        description: "Matrix tier to run"
        required: false
        default: "standard"
        type: choice
        options:
          - smoke
          - standard
          - full
      repeats:
        description: "Medians per cell per engine (blank = the tier default)"
        required: false
        default: ""
        type: string
      engines:
        description: "Comma-separated engine list (blank = the tier default)"
        required: false
        default: ""
        type: string
      runner:
        description: "Which platform measures it"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - ubuntu
          - ubuntu-arm
          - macos
          - windows
      only:
        description: "Comma-separated scenario substring filter (blank = every scenario in the tier)"
        required: false
        default: ""
        type: string

concurrency:
  group: matrix-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings --cfg aes_armv8 --cfg polyval_armv8

jobs:
  setup:
    name: plan the tier and its cells
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      cells: ${{ steps.plan.outputs.cells }}
      oses: ${{ steps.plan.outputs.oses }}
      flags: ${{ steps.plan.outputs.flags }}
      trees: ${{ steps.plan.outputs.trees }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          WANT_TIER: ${{ inputs.tier }}
          WANT_ONLY: ${{ inputs.only }}
          WANT_REPEATS: ${{ inputs.repeats }}
          WANT_ENGINES: ${{ inputs.engines }}
          WANT_RUNNER: ${{ inputs.runner }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          matrix=true
          planned=""
          planned_engines=""
          if [[ "$EVENT" == "pull_request" ]]; then
            # A change that reaches one method is measured there, against every
            # engine that method's page records as able to serve it, at the full
            # tier's repeats; the methods it does not reach are not measured on
            # this run at all. Shared code reaches everything, so a wide plan
            # keeps the smoke cell and the nightly run carries the depth.
            if [[ "$(python3 scripts/ci-scope.py scope --base "$BASE" |
              sed -n 's/^wide=//p')" == "false" ]]; then
              tier="full"
              planned="$(python3 scripts/ci-scope.py scenarios)"
              planned_engines="$(python3 scripts/ci-scope.py engines | paste -sd, -)"
              [[ -n "$planned" ]] || matrix=false
            else
              tier="smoke"
            fi
            oses='["ubuntu-latest"]'
          elif [[ "$EVENT" == "workflow_dispatch" ]]; then
            tier="${WANT_TIER:-standard}"
            case "${WANT_RUNNER:-all}" in
              ubuntu) oses='["ubuntu-latest"]' ;;
              ubuntu-arm) oses='["ubuntu-24.04-arm"]' ;;
              macos) oses='["macos-15"]' ;;
              windows) oses='["windows-latest"]' ;;
              *) if [[ "$tier" == "full" ]]; then
                   oses='["ubuntu-latest", "ubuntu-24.04-arm", "macos-15"]'
                 else
                   oses='["ubuntu-latest", "ubuntu-24.04-arm", "macos-15", "windows-latest"]'
                 fi ;;
            esac
          elif [[ "$SCHEDULE" == "17 4 * * 0" ]]; then
            tier="full"
            oses='["ubuntu-latest", "ubuntu-24.04-arm", "macos-15"]'
          else
            tier="standard"
            oses='["ubuntu-latest"]'
          fi
          case "$tier" in smoke | standard | full) ;; *) echo "::error::unknown tier $tier" >&2; exit 2 ;; esac
          source scripts/lib-matrix.sh
          if [[ -n "$planned" ]]; then
            ids="$planned"
          else
            ids="$(scenarios "$tier" | awk '{print $1}')"
          fi
          if [[ -n "$WANT_ONLY" ]]; then
            kept=""
            IFS=',' read -ra pats <<< "$WANT_ONLY"
            for id in $ids; do
              for pat in "${pats[@]}"; do
                [[ -n "$pat" ]] || continue
                if [[ "$id" == *"$pat"* ]]; then
                  kept="$kept $id"
                  break
                fi
              done
            done
            ids="$kept"
          fi
          cells="$(for id in $ids; do printf '"%s",' "$id"; done)"
          cells="[${cells%,}]"
          # No cell is an error, unless the plan says so: a method the matrix does
          # not measure yet has nothing to run here and the nightly wide run has it.
          if [[ "$cells" == "[]" && "$matrix" != "false" ]]; then
            echo "::error::no scenario survived the filter" >&2
            exit 1
          fi
          flags=""
          [[ -n "$WANT_REPEATS" ]] && flags="$flags --repeats $WANT_REPEATS"
          trees="xray-core,xray-core-rust,sing-box,zeronet,leaf,xray-rust"
          if [[ -n "$WANT_ENGINES" ]]; then
            # A typed list is the caller's own, ferrox included or not.
            flags="$flags --engines $WANT_ENGINES"
          elif [[ -n "$planned_engines" ]]; then
            # The page ruled the rest out, so this run neither fetches, builds nor
            # probes them; the nightly wide run still measures everything.
            flags="$flags --engines ferrox,$planned_engines"
            trees="$planned_engines"
          elif [[ "$tier" == "smoke" ]]; then
            trees="xray-core,xray-core-rust,sing-box,zeronet"
          fi
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "cells=$cells" >> "$GITHUB_OUTPUT"
          echo "oses=$oses" >> "$GITHUB_OUTPUT"
          echo "flags=$flags" >> "$GITHUB_OUTPUT"
          echo "trees=$trees" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "tier $tier cells: $cells"

  fetch:
    name: fetch the comparator trees this plan compares against
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.matrix == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: fetch at the pins
        shell: bash
        env:
          TREES: ${{ needs.setup.outputs.trees }}
        run: ./scripts/fetch-upstream.sh --only "$TREES"
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-trees
          path: upstream/
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error

  run-os:
    name: build and measure (${{ matrix.os }})
    needs: [setup, fetch]
    if: needs.setup.outputs.matrix == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.setup.outputs.oses) }}
    uses: ./.github/workflows/benchmark-matrix-os.yml
    with:
      os: ${{ matrix.os }}
      tier: ${{ needs.setup.outputs.tier }}
      cells: ${{ needs.setup.outputs.cells }}
      flags: ${{ needs.setup.outputs.flags }}

  refresh:
    name: publish the dated bundles
    needs: run-os
    if: github.event_name == 'schedule' && github.event.schedule == '41 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: benchmark-refresh
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-benchmark.txt
      - name: install the chart dependency
        run: pip install -r scripts/requirements-benchmark.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: benchmark-matrix-standard-*
          path: matrix-bundles/
      - name: stamp the bundle date once
        run: echo "STAMP=$(date -u +%F)" >> "$GITHUB_ENV"
      - name: lay out per-runner bundles
        run: |
          published=0
          for bundle in matrix-bundles/benchmark-matrix-standard-*/; do
            slug="$(grep -m1 '^runner: ' "$bundle/manifest.txt" | cut -d' ' -f2)"
            if [[ -z "$slug" ]]; then
              echo "::error::$bundle has no runner: line in manifest.txt"
              exit 1
            fi
            baseline=""
            if [[ -d docs/benchmarks/results ]]; then
              baseline="$(find docs/benchmarks/results -mindepth 2 -maxdepth 2 \
                -type d -name "$slug" ! -path "*/$STAMP/*" | sort | tail -1)"
            fi
            dest="matrix-published/$STAMP/$slug"
            mkdir -p "$dest/charts"
            cp -r "$bundle/cells" "$dest/cells"
            cp "$bundle/matrix-results.json" "$bundle/manifest.txt" "$bundle/README.md" "$dest/"
            if [[ -n "$baseline" ]]; then
              delta=0
              python3 scripts/benchmark-delta.py \
                --new "$bundle/matrix-results.json" \
                --baseline "$baseline/matrix-results.json" \
                --threshold 0.10 --require-change --quiet || delta=$?
              if [[ "$delta" == "1" ]]; then
                echo "$slug: within 10% of $baseline, keeping the published bundle"
                continue
              elif [[ "$delta" != "0" ]]; then
                echo "::error::$slug: delta check failed with exit $delta" >&2
                exit "$delta"
              fi
            fi
            results="docs/benchmarks/results/$STAMP/$slug"
            charts="docs/benchmarks/charts/latest/$slug"
            rm -rf "$charts"
            mkdir -p "$results" "$charts"
            previous=()
            [[ -n "$baseline" ]] && previous=(--previous "$baseline/matrix-results.json")
            python3 scripts/render-benchmark-charts.py \
              --input "$bundle" \
              --charts "$charts" \
              --results "$results/matrix-results.json" \
              --readme docs/benchmarks/matrix.md \
              --runner "$slug" \
              "${previous[@]}"
            cp "$results/matrix-results.json" "$results/manifest.txt" "$results/README.md" "$dest/"
            cp -R "$charts"/. "$dest/charts/"
            python3 scripts/validate-benchmark-matrix.py \
              --cells "$dest/cells" \
              --results "$results/matrix-results.json" \
              --charts "$charts"
            published=$((published + 1))
          done
          echo "published $published runner bundle(s)"
      - name: commit the refreshed matrix on a review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C benchmark-matrix/auto
          git add -A docs/benchmarks
          if git diff --cached --quiet; then
            echo "nothing to publish"
            exit 0
          fi
          git commit -m "docs: refresh benchmark matrix ($STAMP)"
          git push --force-with-lease origin benchmark-matrix/auto
          existing="$(gh pr list --head benchmark-matrix/auto --state open --json number --jq '.[0].number // empty')"
          [[ -n "$existing" ]] || gh pr create --base main --head benchmark-matrix/auto \
            --title "docs: refresh benchmark matrix" \
            --body "Automated refresh of docs/benchmarks/matrix.md and the latest charts from the scheduled matrix run."
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-matrix-published-${{ env.STAMP }}
          path: matrix-published/
          retention-days: 90
          if-no-files-found: error
