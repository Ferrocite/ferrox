name: conformance


on:
  pull_request:
    paths:
      - "crates/ferrox-app/**/*.rs"
      - "crates/ferrox-core/**/*.rs"
      - "upstream/pins.toml"
      - "scripts/run-upstream-suite.sh"
      - ".github/workflows/conformance.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  suites:
    name: upstream suites (enabled only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: conformance
      - name: upstream suites by test_enabled bit
        run: ./scripts/run-upstream-suite.sh
