name: conformance


on:
  pull_request:
    paths:
      - "crates/ferrox-app/**/*.rs"
      - "crates/ferrox-core/**/*.rs"
      - "upstream/pins.toml"
      - "scripts/run-upstream-suite.sh"
      - ".github/workflows/conformance.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  plan:
    name: plan what this change owes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      wide: ${{ steps.scope.outputs.wide }}
      suites: ${{ steps.scope.outputs.suites }}
      methods: ${{ steps.scope.outputs.methods }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: plan the scope
        id: scope
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            python3 scripts/ci-scope.py scope --base "$BASE"
          else
            python3 scripts/ci-scope.py scope --wide
          fi

  suites:
    name: upstream suites (those in scope)
    needs: plan
    if: needs.plan.outputs.suites == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: conformance
      # A pin's rev is immutable, so its build is cacheable by the pin file; a pin bump is a new key.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ferrox-upstream
          key: upstream-build-${{ runner.os }}-${{ hashFiles('upstream/pins.toml') }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: upstream-go-${{ runner.os }}-${{ hashFiles('upstream/pins.toml') }}
      - name: plan the scope, so each suite is read from the same plan
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            python3 scripts/ci-scope.py scope --base "$BASE" > /dev/null
          else
            python3 scripts/ci-scope.py scope --wide > /dev/null
          fi
      - name: upstream suites by test_enabled bit
        run: ./scripts/run-upstream-suite.sh
