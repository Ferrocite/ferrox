name: benchmark-matrix os

on:
  workflow_call:
    inputs:
      os:
        description: "The one runner this leg builds and measures on"
        required: true
        type: string
      tier:
        description: "Matrix tier"
        required: true
        type: string
      cells:
        description: "JSON array of cell ids"
        required: true
        type: string
      flags:
        description: "Extra run-benchmark-matrix flags"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings --cfg aes_armv8 --cfg polyval_armv8

jobs:
  build:
    name: build the engines (${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: upstream/pins.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: benchmark-matrix
      - name: install the QUIC build tool
        if: runner.os == 'Windows'
        run: choco install nasm -y --no-progress || echo "nasm already installed"
      - name: install protoc for xray-core-rust
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler ;;
            macOS) brew install protobuf ;;
            Windows) choco install protoc -y --no-progress || echo "protoc already installed" ;;
          esac
      - uses: actions/download-artifact@v4
        with:
          name: upstream-trees
          path: upstream
      - uses: actions/cache@v4
        with:
          path: target/parity-engines
          key: matrix-engines-${{ inputs.os }}-${{ hashFiles('upstream/pins.toml', 'scripts/lib-engines.sh', 'scripts/patch-sing-box.py') }}
      - name: build every engine without moving traffic
        shell: bash
        env:
          FERROX_UPSTREAM_HANDOFF: "1"
        run: >
          ./scripts/run-benchmark-matrix.sh
          --tier "${{ inputs.tier }}"
          --out target/benchmark-matrix
          --build-only
          ${{ inputs.flags }}
      - uses: actions/upload-artifact@v4
        with:
          name: matrix-ferrox-${{ inputs.os }}
          path: |
            target/release/ferrox-bench*
            target/release/ferrox-app*
          retention-days: 1
          if-no-files-found: error

  cells:
    name: measure ${{ matrix.cell }} (${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    needs: build
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(inputs.cells) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # No pip cache here: this job installs nothing, so setup-python's post
      # step has no cache to save and fails on the empty folder.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: matrix-ferrox-${{ inputs.os }}
          path: target/release
      - uses: actions/cache@v4
        with:
          path: target/parity-engines
          key: matrix-engines-${{ inputs.os }}-${{ hashFiles('upstream/pins.toml', 'scripts/lib-engines.sh', 'scripts/patch-sing-box.py') }}
      - name: allow the kernel WireGuard client to open a link
        if: runner.os == 'Linux' && contains(inputs.cells, 'wireguard-kernel')
        shell: bash
        run: |
          sudo modprobe wireguard || true
          sudo ip link add ferrox-wg-probe type wireguard
          sudo ip link del ferrox-wg-probe
          command -v setcap >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq libcap2-bin
          }
          sudo setcap cap_net_admin+ep target/release/ferrox-app
      - name: run one cell with handed-over binaries
        shell: bash
        env:
          FERROX_UPSTREAM_HANDOFF: "1"
        run: >
          ./scripts/run-benchmark-matrix.sh
          --tier "${{ inputs.tier }}"
          --out target/benchmark-matrix
          --only "${{ matrix.cell }}"
          --no-build
          ${{ inputs.flags }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matrix-cell-${{ inputs.os }}-${{ matrix.cell }}
          path: target/benchmark-matrix/
          retention-days: 1
          if-no-files-found: error

  collect:
    name: render the bundle (${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    needs: cells
    if: ${{ !cancelled() }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-benchmark.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: matrix-cell-${{ inputs.os }}-*
          path: cell-bundles/
      - name: install the chart dependency
        shell: bash
        run: pip install -r scripts/requirements-benchmark.txt
      - name: merge the cells and render once
        shell: bash
        run: |
          rm -rf target/benchmark-matrix
          mkdir -p target/benchmark-matrix/cells
          first=""
          for bundle in cell-bundles/matrix-cell-${{ inputs.os }}-*/; do
            [[ -z "$first" ]] && first="$bundle"
            cp -r "$bundle"/cells/* target/benchmark-matrix/cells/
            cat "$bundle/commands.sh" >> target/benchmark-matrix/commands.sh
          done
          [[ -n "$first" ]] || { echo "::error::no cell bundle for ${{ inputs.os }}" >&2; exit 1; }
          cp "$first/manifest.txt" target/benchmark-matrix/manifest.txt
          runner="$(grep -m1 '^runner: ' target/benchmark-matrix/manifest.txt | cut -d' ' -f2)"
          baseline=""
          if [[ -d docs/benchmarks/results ]]; then
            baseline="$(find docs/benchmarks/results -mindepth 2 -maxdepth 2 \
              -type d -name "$runner" | sort | tail -1)"
          fi
          previous=()
          [[ -n "$baseline" ]] && previous=(--previous "$baseline/matrix-results.json")
          python3 scripts/render-benchmark-charts.py \
            --input target/benchmark-matrix \
            --charts target/benchmark-matrix/charts \
            --results target/benchmark-matrix/matrix-results.json \
            "${previous[@]}"
          python3 scripts/validate-benchmark-matrix.py \
            --cells target/benchmark-matrix/cells \
            --results target/benchmark-matrix/matrix-results.json \
            --charts target/benchmark-matrix/charts \
            --bundle-readme target/benchmark-matrix/README.md
          python3 scripts/check-matrix-legs.py --cells target/benchmark-matrix/cells --baseline scripts/leg-gaps.txt
      - name: refuse a bundle that measured nothing
        shell: bash
        run: |
          cells="$(find target/benchmark-matrix/cells -name cell.json | wc -l)"
          echo "cells with a report: $cells"
          if [[ "$cells" == "0" ]]; then
            echo "::error::no matrix cell produced a report on ${{ inputs.os }}; \
              the run above exited 0 without measuring anything"
            exit 1
          fi
      - name: publish the text table
        if: always()
        shell: bash
        run: |
          {
            if [[ -f target/benchmark-matrix/table.md ]]; then
              cat target/benchmark-matrix/table.md
              echo
              echo "The text-only tables and repeat spread are the \`benchmark-matrix-table-${{ inputs.tier }}-${{ inputs.os }}\` artifact; the bundle below is the charts and images."
            else
              echo "no text table written"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-matrix-table-${{ inputs.tier }}-${{ inputs.os }}
          path: |
            target/benchmark-matrix/table.md
            target/benchmark-matrix/table.csv
            target/benchmark-matrix/distribution.csv
            target/benchmark-matrix/matrix-results.json
            target/benchmark-matrix/manifest.txt
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-matrix-${{ inputs.tier }}-${{ inputs.os }}
          path: target/benchmark-matrix/
          retention-days: 30
          if-no-files-found: error

  result:
    name: result
    needs: [build, cells, collect]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/result
        with:
          title: benchmark-matrix-os
          needs: ${{ toJSON(needs) }}
          artifacts: benchmark-matrix-table-${{ inputs.tier }}-${{ inputs.os }},benchmark-matrix-${{ inputs.tier }}-${{ inputs.os }}
          suffix: -${{ inputs.os }}
