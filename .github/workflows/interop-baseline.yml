name: interop-baseline


on:
  pull_request:
    paths:
      - "crates/**/*.rs"
      - "upstream/pins.toml"
      - "scripts/run-interop-baseline.sh"
      - ".github/workflows/interop-baseline.yml"
  schedule:
    - cron: "41 8 * * 1"
  workflow_dispatch:
    inputs:
      suite:
        description: "suite to run (all|zeronet|xray-rust)"
        required: false
        default: "all"

concurrency:
  group: interop-baseline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: plan what this change owes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      wide: ${{ steps.scope.outputs.wide }}
      suites: ${{ steps.scope.outputs.suites }}
      methods: ${{ steps.scope.outputs.methods }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: plan the scope
        id: scope
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            python3 scripts/ci-scope.py scope --base "$BASE"
          else
            python3 scripts/ci-scope.py scope --wide
          fi

  baseline:
    name: suites in scope vs ferrox-app (informational, never red on test failures)
    needs: plan
    if: needs.plan.outputs.suites == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: interop-baseline
      - name: plan the scope, so each suite is read from the same plan
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            python3 scripts/ci-scope.py scope --base "$BASE" > /dev/null
          else
            python3 scripts/ci-scope.py scope --wide > /dev/null
          fi
      - name: run every suite test in scope vs ferrox-app, document, stay green
        shell: bash
        env:
          BASELINE_SUITES: ${{ inputs.suite }}
        run: ./scripts/run-interop-baseline.sh "${BASELINE_SUITES:-all}"
      - name: publish the per-test verdicts
        if: always()
        shell: bash
        run: |
          {
            echo
            echo '```'
            cat target/interop-baseline/interop-baseline-summary.md 2>/dev/null || echo "no summary written"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: upload the full logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-baseline-${{ github.run_id }}
          path: target/interop-baseline/
          retention-days: 30
          if-no-files-found: error
