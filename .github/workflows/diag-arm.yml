name: diag-arm

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: fetch the reference
        run: ./scripts/fetch-upstream.sh --only xray-core
      - name: build
        run: cargo build --locked --release -p ferrox-bench -p ferrox-app
      - name: capture and measure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diag
          sudo tcpdump -i lo -s 0 -U -w diag/loopback.pcap >/tmp/tcpdump.log 2>&1 &
          echo $! >/tmp/tcpdump.pid
          sleep 1
          timeout --kill-after=30s 900 ./scripts/run-benchmark-matrix.sh \
            --tier full --only vless-encryption-raw-down-8 \
            --engines xray-core,ferrox --repeats 1 --no-build --out diag/out || true
          sudo pkill -INT -x tcpdump || true
          sleep 1
          sudo chown "$(id -u):$(id -g)" diag/loopback.pcap 2>/dev/null || true
          cat /tmp/tcpdump.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-arm-${{ github.run_id }}
          path: diag/
          if-no-files-found: warn
          retention-days: 7
