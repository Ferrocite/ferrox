name: ci


on:
  schedule:
    - cron: "37 6 * * *"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/*.rs"
      - "crates/**/*.toml"
      - "scripts/**"
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "1"
  RUSTFLAGS: -D warnings --cfg aes_armv8 --cfg polyval_armv8

jobs:
  plan:
    name: what this change owes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: plan the scope
        id: scope
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            python3 scripts/ci-scope.py scope --base "$BASE"
          else
            python3 scripts/ci-scope.py scope --wide
          fi

  lint:
    name: lint, docs and gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci
      - run: cargo fmt --all -- --check
      - name: lint the workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings -W clippy::perf -W clippy::suspicious
      - run: cargo doc --workspace --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: prove the stall detector names the hang
        shell: bash
        # watch-test.sh is what cuts a hung suite at the quiet limit and points at the
        # one test that never returns; nothing else runs its selftest, so gate it here.
        run: ./scripts/watch-test.sh --selftest
      - name: the CLI's own gates
        run: |
          python3 scripts/check-cli-args.py
          python3 scripts/check-cli-lane.py
      - name: the gates that do not need a toolchain
        env:
          GATES: check-leak-surface check-comments check-merge-markers check-fixture-safety check-dependency-policy check-windows-binary-paths check-method-docs check-ci-scope
        run: |
          for gate in $GATES; do
            ( "./scripts/$gate.sh" > "/tmp/$gate.log" 2>&1; echo $? > "/tmp/$gate.rc" ) &
          done
          wait
          status=0
          for gate in $GATES; do
            cat "/tmp/$gate.log"
            rc="$(cat "/tmp/$gate.rc")"
            if [ "$rc" != 0 ]; then
              echo "::error::$gate.sh exited $rc"
              status=$rc
            fi
          done
          exit "$status"

  test:
    name: test (${{ matrix.name }})
    needs: plan
    # Three compilers build the same unchanged workspace because a page's prose
    # moved. `rust` is what the compiler reads, so a wide plan of workflow files
    # and scripts answers false here; a schedule, with no diff to read, answers true.
    if: needs.plan.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x86_64
            os: ubuntu-latest
          - name: macos aarch64
            os: macos-latest
          - name: windows x86_64
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci
      - name: install the QUIC build tool
        if: runner.os == 'Windows'
        shell: bash
        run: choco install nasm -y --no-progress || { choco list --local-only 2>/dev/null | grep -iq nasm; }
      - name: run the full suite
        id: test
        shell: bash
        timeout-minutes: 45
        env:
          # Stage tracing for the loopback echo family: captured per test and
          # printed only on failure, so the next scheduler stall names where
          # it stopped (P47) at zero cost to a green run.
          FERROX_ECHO_TRACE: 1
        run: |
          ./scripts/watch-test.sh --out "target/ci/test-${{ matrix.os }}.log" -- \
            cargo test --workspace --locked 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: publish the log the stall was cut from
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.os }}
          path: target/ci/*.log
          retention-days: 14
          if-no-files-found: error
      - name: publish the verdict
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.test.outcome }}
        run: |
          {
            echo "### test (${{ matrix.name }})"
            echo '```'
            uname -a 2>/dev/null || ver
            rustc -vV
            echo '```'
            echo "cargo test --workspace --locked: $OUTCOME"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$OUTCOME" != "success" ]; then
            echo "::error::cargo test on ${{ matrix.name }} did not succeed (outcome: $OUTCOME)"
            exit 1
          fi

