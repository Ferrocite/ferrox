name: profile

on:
  workflow_dispatch:
    inputs:
      cell:
        description: "Scenario id to profile (one full-tier row)"
        required: true
        default: "vless-tls-grpc-up-1"
        type: string
      engine:
        description: "Server engine to profile"
        required: true
        default: "ferrox"
        type: choice
        options:
          - ferrox

concurrency:
  group: profile-${{ github.ref }}-${{ inputs.cell }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-C force-frame-pointers=yes -D warnings --cfg aes_armv8 --cfg polyval_armv8"

jobs:
  profile:
    name: profile ${{ inputs.cell }} on ${{ inputs.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: install perf and flamegraph
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq linux-tools-common linux-tools-generic protobuf-compiler
          perf=""
          for candidate in /usr/lib/linux-tools/*/perf "$(command -v perf || true)"; do
            [[ -n "$candidate" && -x "$candidate" ]] || continue
            if "$candidate" --version >/dev/null 2>&1; then
              perf="$candidate"
              break
            fi
          done
          [[ -n "$perf" ]] || { echo "::error::no working perf binary" >&2; exit 1; }
          sudo ln -sf "$perf" /usr/local/bin/perf
          sudo sysctl -w kernel.perf_event_paranoid=-1
          perf --version
          git clone --depth 1 https://github.com/brendangregg/FlameGraph /tmp/FlameGraph
      - name: fetch the reference
        shell: bash
        run: ./scripts/fetch-upstream.sh --only xray-core
      - name: build with symbols and frame pointers
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_STRIP: "false"
          CARGO_PROFILE_RELEASE_DEBUG: "1"
        run: cargo build --locked --release -p ferrox-bench -p ferrox-app
      - name: measure one cell under perf
        shell: bash
        env:
          CELL: ${{ inputs.cell }}
          PROFILE_SERVER: ${{ inputs.engine }}
        run: |
          PROFILE_DIR="$PWD/profile" timeout --kill-after=30s 900 ./scripts/run-benchmark-matrix.sh \
            --tier full --only "$CELL" --engines xray-core,ferrox \
            --repeats 1 --no-build --out profile/out || true
          ls -la profile profile/out/cells 2>/dev/null || true
          sampled=0
          for data in profile/*.perf.data; do
            if perf report --stdio -i "$data" 2>/dev/null | grep -E '^ +[0-9]+\.[0-9]+%' >/dev/null; then
              sampled=1
            fi
          done
          if [[ "$sampled" == "0" ]]; then
            echo "::error::no perf samples were produced" >&2
            tail -40 profile/out/summary.txt 2>/dev/null || true
            exit 1
          fi
      - name: collapse the profiles
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for data in profile/*.perf.data; do
            base="${data%.perf.data}"
            perf report --stdio --no-children -i "$data" \
              --sort comm,dso,symbol --percent-limit 0.2 > "$base.report.txt" 2>&1 || true
            perf report --stdio --no-children -g none -i "$data" \
              --sort symbol --percent-limit 0.5 > "$base.symbols.txt" 2>&1 || true
            perf script -i "$data" 2>/dev/null \
              | /tmp/FlameGraph/stackcollapse-perf.pl --all > "$base.collapsed" || true
            /tmp/FlameGraph/flamegraph.pl --title "$(basename "$base")" \
              < "$base.collapsed" > "$base.svg" || true
            top="$(awk '/^ +[0-9]+\.[0-9]+%/{sub(/^ +[0-9.]+% +\[.\] +/,""); print; exit}' \
              "$base.symbols.txt" 2>/dev/null || true)"
            [[ -n "$top" ]] && perf annotate --stdio -i "$data" -s "$top" \
              > "$base.annotate.txt" 2>&1 || true
          done
          du -sh profile || true
      - uses: actions/upload-artifact@v4
        with:
          name: profile-${{ github.run_id }}
          path: profile/
          retention-days: 14
          if-no-files-found: error
      - name: summary
        shell: bash
        run: |
          for report in profile/*.report.txt; do
            echo "## $(basename "$report" .report.txt)"
            head -40 "$report" || true
          done >> "$GITHUB_STEP_SUMMARY"
